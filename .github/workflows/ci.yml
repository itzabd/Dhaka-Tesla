name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dhaka_tesla_pool
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Create .env.test
        working-directory: server
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/dhaka_tesla_pool" > .env.test
          echo "JWT_SECRET=test_secret_change_me" >> .env.test

      - name: Build server (compiles dist/scripts/migrate.js)
        working-directory: server
        run: npm run build

      - name: Run migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dhaka_tesla_pool
          JWT_SECRET: test_secret_change_me
        run: npm run db:migrate

      - name: Run tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dhaka_tesla_pool
          JWT_SECRET: test_secret_change_me
        run: npm test

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build
